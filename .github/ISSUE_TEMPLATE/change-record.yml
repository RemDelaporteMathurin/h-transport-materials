# Generated by `htm contribute form` from h_transport_materials/records/contribute.py.
# Edit that module, not this file: a test checks that the two agree.
name: Change a record
description: Correct a record, or flag it for a verifier. A bot turns the issue into a pull request.
title: 'Change: '
labels:
- change-record
body:
- type: markdown
  attributes:
    value: 'Fill in only what is wrong: **an empty field keeps the current value**. Coming from the [explorer](https://remdelaportemathurin.github.io/h-transport-materials/), *Current values* shows what HTM holds now. A wrong material, isotope or property needs a new record: say so under *What is wrong* and choose *Only flag it*.'
- type: input
  id: record
  attributes:
    label: Record
    description: The record id
    placeholder: htm:W-D-H-frauenfelder1969
  validations:
    required: true
- type: dropdown
  id: kind
  attributes:
    label: What to do
    options:
    - Change the values
    - Only flag it for a verifier
  validations:
    required: true
- type: textarea
  id: current
  attributes:
    label: Current values
    description: 'For reference, as stored in the record. Editing this box changes nothing: use the fields below.'
    render: yaml
  validations:
    required: false
- type: textarea
  id: reason
  attributes:
    label: What is wrong, and where in the paper
  validations:
    required: true
- type: input
  id: location
  attributes:
    label: Where in the paper
    description: Table, equation or figure
    placeholder: Table 2
  validations:
    required: false
- type: dropdown
  id: law
  attributes:
    label: Law
    options:
    - Sieverts' law (pressure^0.5)
    - Henry's law (pressure)
    - Not applicable (diffusivity and surface coefficients)
  validations:
    required: false
- type: dropdown
  id: method
  attributes:
    label: Method
    options:
    - gas-absorption
    - gas-permeation
    - time-lag
    - isovolumetric-desorption
    - tds
    - ion-implantation
    - electrochemical
    - isotope-extrapolation
    - dft
    - md
    - review
    - unknown
  validations:
    required: false
- type: markdown
  attributes:
    value: '**Arrhenius law.** For an Arrhenius law, or for the authors'' fit of their points: value = pre-exponential factor × exp(−E / k<sub>B</sub>T). Type the numbers and units exactly as printed: HTM converts them, and keeps what you typed.'
- type: input
  id: pre_exp
  attributes:
    label: Pre-exponential factor
    placeholder: '4.1e-3'
  validations:
    required: false
- type: input
  id: pre_exp_unit
  attributes:
    label: Unit of the pre-exponential factor
    description: As printed, e.g. cm^2/s, mol/m^3/Pa^0.5, mol m^-1 s^-1 Pa^-0.5, m^4/s
    placeholder: cm^2/s
  validations:
    required: false
- type: input
  id: act_energy
  attributes:
    label: Activation energy
    placeholder: '0.39'
  validations:
    required: false
- type: input
  id: act_energy_unit
  attributes:
    label: Unit of the activation energy
    description: eV, kJ/mol, kcal/mol, or K when the paper gives E/k_B
    placeholder: eV
  validations:
    required: false
- type: input
  id: t_min
  attributes:
    label: Lowest temperature of the range
    description: Only if the paper gives it
    placeholder: '1100'
  validations:
    required: false
- type: input
  id: t_max
  attributes:
    label: Highest temperature of the range
    placeholder: '2400'
  validations:
    required: false
- type: dropdown
  id: t_unit
  attributes:
    label: Unit of the temperature range
    options:
    - K
    - °C
  validations:
    required: false
- type: markdown
  attributes:
    value: '**Data points.** As read from a table or a figure (e.g. with [WebPlotDigitizer](https://automeris.io/WebPlotDigitizer)), before any conversion.'
- type: textarea
  id: points
  attributes:
    label: Data points
    description: Two columns, x then y, one row per point. Separate them with a comma, a semicolon, a tab or spaces.
    placeholder: '1.05, 3.2e-9

      1.10, 2.1e-9'
    render: csv
  validations:
    required: false
- type: dropdown
  id: x_axis
  attributes:
    label: x column
    options:
    - T (K)
    - T (°C)
    - 1000/T (1/K)
    - 10000/T (1/K)
    - 1/T (1/K)
  validations:
    required: false
- type: dropdown
  id: y_scale
  attributes:
    label: y column
    options:
    - the value
    - ln(value)
    - log10(value)
  validations:
    required: false
- type: input
  id: y_unit
  attributes:
    label: Unit of y
    description: Unit of the value itself, also when the column is its logarithm
    placeholder: m^2/s
  validations:
    required: false
- type: input
  id: digitised_from
  attributes:
    label: Points read from
    placeholder: Fig. 5
  validations:
    required: false
- type: dropdown
  id: fit_choice
  attributes:
    label: If the points and the authors' fit disagree
    description: Only for data points with the authors' fit
    options:
    - 'Let HTM decide: the authors'' fit unless it is more than 10% away from the points'
    - Use the authors' fit
    - Use HTM's fit of the points
  validations:
    required: false
- type: input
  id: fit_note
  attributes:
    label: Why that fit
    description: Needed if you chose a fit above
    placeholder: the fit in Table 2 uses all the runs
  validations:
    required: false
- type: input
  id: orcid
  attributes:
    label: Your ORCID
    description: Optional, to credit you in the record
    placeholder: 0000-0002-1825-0097
  validations:
    required: false
