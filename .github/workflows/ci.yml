name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pint: "pint==0.24.4"
          - python-version: "3.14"
            pint: "pint"

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[tests,plotly,build]
        python -m pip install --upgrade "${{ matrix.pint }}"
        pip install flake8
    - name: Compile the records into the installed package
      run: |
        # as the release workflow does: htm.database is built from this file
        python -m h_transport_materials.records.build --data data --out h_transport_materials/_data/htm-data.json
        python -m pip install --no-deps --force-reinstall .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest --cov h_transport_materials --cov-report xml --cov-report term

    - name: Test import
      run: |
        cd ..
        python -c "import h_transport_materials"

    - name: Upload to codecov
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml

  wheel:
    # the wheel must ship the compiled record database and read it without
    # the build extra (no pydantic, no pyyaml)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Compile the record database and build the wheel
      run: |
        python -m pip install --upgrade pip build
        python -m pip install -e ".[build]"
        htm build --data data --out h_transport_materials/_data/htm-data.json
        python -m build --wheel
    - name: Install the wheel in a clean environment and read a record
      run: |
        python -m venv /tmp/clean
        /tmp/clean/bin/pip install dist/*.whl
        cd /tmp
        /tmp/clean/bin/python -c "
        import sys
        import h_transport_materials as htm
        D = htm.get('htm:W-D-H-frauenfelder1969')
        print(D.record_id, D.pre_exp, D.act_energy)
        assert D.record['reported']['pre_exp']['unit'] == 'cm^2/s'
        assert 'pydantic' not in sys.modules and 'yaml' not in sys.modules
        "

  check_unused_variables:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x  # Choose your desired Python version

      - name: Install vulture
        run: pip install vulture

      - name: Check for unused variables
        continue-on-error: true
        run: vulture h_transport_materials/property_database

      - name: Check vulture output
        run: |
          vulture_output=$(vulture h_transport_materials/property_database) || true
          if [[ $vulture_output == *"unused variable"* ]]; then
            echo "Error: Unused variables found."
            exit 1
          fi
