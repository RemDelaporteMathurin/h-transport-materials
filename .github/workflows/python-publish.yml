# Builds and uploads the package to PyPI when a release is published,
# then attaches the compiled database to the release.
# PyPI publishing uses trusted publishing (OIDC): no API token needed.
# See https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1

  compile_database:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile database
        run: |
          pip install h_transport_materials==${{ github.ref_name }}
          python -c "import h_transport_materials as htm;htm.database.export_to_json('database.json')"

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} database.json --repo ${{ github.repository }}
