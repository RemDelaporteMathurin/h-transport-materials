note: >-
  Bulk diffusivity of tritium, determined in Section 4 of the thesis by fitting a
  transport model to retention data. Single temperature only. The text quotes it
  next to a 600 C value for 316 steel. It matches the fit D = 0.417 exp(-235 kJ/mol / RT)
  m2/s on PDF p.228 evaluated at 873 K. About 2e4 times higher than Atsumi 1988
  (htm:C-D-D-atsumi1988) at the same temperature, a model-fit value on a different graphite grade.
